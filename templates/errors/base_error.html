{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Siptic Manager{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/base.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/errors.css' %}"
    >
</head>

<body class="error-page">
    <main class="error-shell">
        <section class="error-card">
            <div class="error-brand">
                <span class="brand-mark">SM</span>
                <strong>Siptic Manager</strong>
            </div>

            <p class="page-eyebrow">
                {% block eyebrow %}{% endblock %}
            </p>

            <h1>
                {% block heading %}{% endblock %}
            </h1>

            <p>
                {% block description %}{% endblock %}
            </p>

            <a
                class="error-action"
                href="{% url 'callcenters:list' %}"
            >
                Volver a call centers
            </a>
        </section>
    </main>
</body>
</html>
